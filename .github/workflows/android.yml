name: Android

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and verify
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app startup on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INSTAGRAM_TEST_LINK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.INSTAGRAM_TEST_LINK || '' }}
          INSTAGRAM_TEST_REEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.INSTAGRAM_TEST_REEL || '' }}
          INSTAGRAM_TEST_STORY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.INSTAGRAM_TEST_STORY || '' }}
          INSTAGRAM_TEST_CAROUSEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && secrets.INSTAGRAM_TEST_CAROUSEL || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            bash scripts/android-startup-smoke.sh app/build/outputs/apk/debug/app-debug.apk
            bash scripts/android-gallery-smoke.sh
            if [ -n "$INSTAGRAM_TEST_LINK" ]; then bash scripts/android-instagram-download-smoke.sh post "$INSTAGRAM_TEST_LINK"; fi
            if [ -n "$INSTAGRAM_TEST_REEL" ]; then bash scripts/android-instagram-download-smoke.sh reel "$INSTAGRAM_TEST_REEL"; fi
            if [ -n "$INSTAGRAM_TEST_STORY" ]; then bash scripts/android-instagram-download-smoke.sh story "$INSTAGRAM_TEST_STORY"; fi
            if [ -n "$INSTAGRAM_TEST_CAROUSEL" ]; then bash scripts/android-instagram-download-smoke.sh carousel "$INSTAGRAM_TEST_CAROUSEL" 5; fi
      - uses: actions/upload-artifact@v7
        with:
          name: Souvenir-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE" && test -n "$RELEASE_PASSWORD"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RELEASE_STORE_FILE"
          bash gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Souvenir.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.$GITHUB_RUN_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Souvenir.apk --clobber
          else
            gh release create "$tag" Souvenir.apk \
              --target "$GITHUB_SHA" --title "Souvenir $tag" --generate-notes
          fi
